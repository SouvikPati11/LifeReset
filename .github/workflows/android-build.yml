name: Android Build

# Builds a release APK and uploads it as a workflow artifact.
#
# The project's android/app/build.gradle.kts signs the release build with the
# debug keys, so this builds a runnable release APK with no signing secrets.
# Firebase works from lib/firebase_options.dart, so no google-services.json is
# required. This workflow only reads the repo — it changes no app code.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "l10n.yaml"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build release APK
        env:
          # Supplied from GitHub repo secrets. Absent on fork PRs — the Gradle
          # release config then falls back to debug signing so the build still
          # succeeds (see android/app/build.gradle.kts).
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "Release keystore configured — building a stably-signed release."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — release will use debug signing."
          fi
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifereset-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
