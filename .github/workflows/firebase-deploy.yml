name: Deploy Firebase

# Deploys Cloud Functions and/or Firestore Rules.
#
# This workflow is MANUAL (workflow_dispatch) on purpose: it never runs on its
# own, so nothing fails while the project is still on the Spark plan. Trigger it
# from the Actions tab once you are ready.
#
#   • Firestore Rules deploy works on Spark today (target: "rules").
#   • Cloud Functions deploy requires the Blaze plan and the function secrets to
#     exist first (see "Before first functions deploy" below).
#
# Nothing here touches the Flutter app.
#
# ── Required repository secrets ───────────────────────────────────────────────
#   FIREBASE_SERVICE_ACCOUNT  JSON key for a service account with deploy rights
#                             (roles: Firebase Admin, Cloud Functions Admin,
#                             Service Account User, and — for functions —
#                             Artifact Registry Admin + Cloud Build Editor).
#   FIREBASE_PROJECT_ID       Your Firebase project id (e.g. lifereset-xxxxx).
#
# ── Before first functions deploy (Blaze) ─────────────────────────────────────
#   Create the secrets the functions reference, once, from a machine with the
#   Firebase CLI:
#     firebase functions:secrets:set GEMINI_API_KEY
#     firebase functions:secrets:set RAZORPAY_KEY_ID
#     firebase functions:secrets:set RAZORPAY_KEY_SECRET
#   Deploying functions before these exist will fail in non-interactive CI.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        required: true
        default: functions_and_rules
        options:
          - functions_and_rules
          - functions
          - rules
  # After upgrading to Blaze you may enable automatic deploys by uncommenting
  # this block (deploys on pushes to the default branch that touch the backend):
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - "functions/**"
  #     - "firestore.rules"
  #     - "firebase.json"

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Using a GitHub Environment lets you add required reviewers / protection
    # rules to gate production deploys. Configure it under Settings → Environments.
    environment: firebase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required secrets are configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          missing=0
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT"; missing=1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Missing repository secret FIREBASE_PROJECT_ID"; missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install functions dependencies
        run: npm install
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Resolve deploy target
        id: target
        run: |
          case "${{ github.event.inputs.target }}" in
            functions)          only="functions" ;;
            rules)              only="firestore:rules" ;;
            functions_and_rules|"") only="functions,firestore:rules" ;;
            *) echo "::error::Unknown target"; exit 1 ;;
          esac
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "Deploying: $only"

      - name: Deploy
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy \
            --only "${{ steps.target.outputs.only }}" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --force

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
